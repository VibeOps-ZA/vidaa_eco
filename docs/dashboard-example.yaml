# VIDAA Eco - example "TV Remotes" dashboard (one view per TV).
# Built only from Home Assistant's own cards - nothing extra to install.
#
# How to use: see docs/dashboard.md. In short: create a new dashboard, open its
# raw configuration editor, paste this file, then replace every
#   living_room_tv          with your TV's entity prefix (e.g. bedroom_tv)
#   media_player.living_room_tv   with your TV's media player entity.
# To add a second TV, copy the whole view (from "- title:" down) and repeat.
title: TV Remotes
views:
- title: Living Room TV
  path: living-room
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Living Room TV
      icon: "mdi:television"
    - type: tile
      entity: media_player.living_room_tv
      name: TV
      features:
      - type: media-player-volume-slider
      features_position: bottom
    - type: tile
      entity: sensor.living_room_tv_activity
      name: Activity
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.living_room_tv_auto_off_status
      name: Auto-off
      grid_options:
        columns: 6
    - type: heading
      heading: Apps
      icon: "mdi:apps"
      heading_style: subtitle
    - type: grid
      columns: 4
      square: false
      cards:
      - type: button
        entity: button.living_room_tv_plex
        name: Plex
        show_state: false
        icon_height: 32px
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.living_room_tv_plex
        hold_action:
          action: none
      - type: button
        entity: button.living_room_tv_youtube
