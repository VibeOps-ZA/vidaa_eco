<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ad0e0"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <!-- TV body -->
  <rect x="34" y="60" width="150" height="104" rx="18" fill="url(#tv)"/>
  <!-- screen -->
  <rect x="48" y="74" width="122" height="76" rx="9" fill="#0b1324"/>
  <!-- soft glow on screen -->
  <rect x="48" y="74" width="122" height="38" rx="9" fill="#ffffff" opacity="0.06"/>
  <!-- stand -->
  <rect x="96" y="164" width="26" height="14" rx="3" fill="#0e7490"/>
  <rect x="74" y="178" width="70" height="10" rx="5" fill="#0e7490"/>
  <!-- Zzz drifting off the top-right -->
  <g fill="#2ad0e0" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="150" y="66" font-size="34">z</text>
    <text x="178" y="48" font-size="46">z</text>
    <text x="210" y="26" font-size="60">Z</text>
  </g>
</svg>
